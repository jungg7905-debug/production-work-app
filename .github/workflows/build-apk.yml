name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production_work_android_phone_build/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: production_work_android_phone_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: production-work-app-debug-apk
          path: production_work_android_phone_build/app/build/outputs/apk/debug/*.apk
